<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rotina</title>
<style>
:root{--bg:#e3ebe3;--p:#f4f8f3;--p2:#e8f0e9;--tx:#17281f;--mu:#5d7066;--ac:#d9432b;--ln:#c4d2c8;--cell:#cfdcd2;--inp:#fff;color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
[data-theme=dark] .chip.pendente{background:#2a3a31;color:#b7cbbd}[data-theme=dark] .chip.andamento{background:#4a3a14;color:#f5c04a}[data-theme=dark] .chip.feito{background:#174a33;color:#6fe0a8}
[data-theme=dark] .btn.pri{color:#0d0d0d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs,15px)/1.5 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 22px;border-bottom:2px solid var(--tx);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font:italic 700 28px Georgia,serif;margin:0}
h2{font:700 20px Georgia,serif;margin:22px 0 10px}
nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:6px 12px;font:inherit;color:var(--mu);cursor:pointer}
nav button.on{color:var(--tx);border-color:var(--ac);font-weight:700}
#sv{font-size:12px;color:var(--mu);width:100%;text-align:right}
.view{display:none;padding:22px;max-width:1000px;margin:auto}.view.on{display:block}
.card{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{margin:0}.stat b{display:block;font:700 32px Georgia,serif;color:var(--ac)}
.mu{color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--p);color:var(--tx);border:1.5px solid var(--tx);border-radius:8px;padding:7px 14px;cursor:pointer;font:inherit;transition:transform .12s,background .12s}
.btn:hover{background:var(--p2);transform:translateY(-1px)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible,.sw:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn.sm{padding:3px 9px;border-color:var(--ln)}
input,select,textarea{background:var(--inp);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:7px 10px;font:inherit}
input[type=color]{padding:0;width:38px;height:32px;cursor:pointer}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac)}
input[type=number]{width:90px}textarea{width:100%;min-height:90px}
form.row input[type=text]{flex:1;min-width:180px}
#pomo{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center}
@media(max-width:720px){#pomo{grid-template-columns:1fr;justify-items:center}}
.ring{width:290px;height:290px;border-radius:50%;background:conic-gradient(var(--ac) var(--pg,0deg),var(--cell) 0);display:grid;place-items:center}
.ring>div{width:258px;height:258px;border-radius:50%;background:var(--p);display:grid;place-items:center;align-content:center}
#clock{font:700 62px Georgia,serif;font-variant-numeric:tabular-nums}
#modes{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
#modes button{border:1.5px solid var(--ln);background:none;color:var(--tx);border-radius:99px;padding:5px 14px;cursor:pointer;font:inherit}
#modes button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}.set label{display:grid;gap:3px;font-size:13px;color:var(--mu)}
.task{border-left:6px solid var(--ln)}.task.andamento{border-left-color:#e0a21a}.task.feito{border-left-color:#2f9e6b;opacity:.75}
.tt{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.chip{padding:1px 10px;border-radius:99px;font-size:12px;font-weight:700}
.chip.pendente{background:#dde5df;color:#4b5d52}.chip.andamento{background:#fbe8b5;color:#7a5200}.chip.feito{background:#c9ecd9;color:#14633f}
.bar{height:9px;background:var(--cell);border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--c,var(--ac))}
.hh{display:flex;justify-content:space-between;gap:10px}
.hmw{display:flex;gap:6px;padding-top:10px}
.wd,.heat{display:grid;grid-template-rows:14px repeat(7,var(--cs));gap:3px}
.wd{flex:none;font-size:10px;color:var(--mu);line-height:var(--cs)}
.heatw{overflow-x:auto;padding-bottom:4px}
.heat{grid-auto-flow:column;grid-auto-columns:var(--cs);width:max-content}
.heat i{display:block;background:var(--cell);border-radius:3px}
.heat i.e{background:none}.heat i.td{outline:2px solid var(--tx);outline-offset:-1px}.heat i.ed{cursor:pointer}.heat i.ed:hover{outline:2px solid var(--ac);outline-offset:-1px}
.ml{font:600 10px/14px system-ui;color:var(--mu);white-space:nowrap}
.hl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:6px}
.lg{display:flex;align-items:center;gap:3px}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block;background:var(--cell)}
.bars{display:flex;align-items:flex-end;gap:5px;height:160px}
.b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:var(--mu)}
.b i{width:100%;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}.b em{font-style:normal}
.entry .mu{font-size:13px}.entry p{white-space:pre-wrap;margin:6px 0 0}
.dsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:12px}
.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.swc{display:flex;gap:4px;align-items:flex-start}
.sw{flex:1;display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--p);color:var(--tx);border:1.5px solid var(--ln);border-radius:10px;padding:8px;cursor:pointer;font:inherit;text-align:left}
.sw.on{border-color:var(--ac);outline:2px solid var(--ac)}
.sp{display:flex;width:100%;height:26px;border-radius:6px;overflow:hidden;border:1px solid var(--ln)}.sp i{flex:1}
.crow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln)}.crow:last-child{border:0}
.cl{display:grid;gap:3px;font-size:12px;color:var(--mu);justify-items:start}
.pv{display:flex;align-items:center;gap:10px;padding:14px;border-radius:10px;margin:12px 0}.pvc{flex:1;padding:10px;border-radius:8px}.pv em{width:60px;height:26px;border-radius:6px}
[hidden]{display:none!important}
#v-pomodoro{max-width:none}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:0 24px;align-items:start}
.pmain,.pside{width:100%;max-width:1000px;margin:0 auto}
.sh{display:block;font:700 18px Georgia,serif;margin-bottom:10px}
.pside form.row{display:grid;gap:8px}.pside form.row input[type=text]{min-width:0}
@media(min-width:1150px){.pgrid{grid-template-columns:minmax(0,1fr) 340px}.pside{position:sticky;top:110px;max-width:none;margin:0}}
.bsug{margin-top:12px;padding:10px 12px;background:var(--p2);border-radius:10px}
#blist{margin-top:10px;max-height:60vh;overflow-y:auto}.bi{display:flex;gap:10px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--ln)}.bi:last-child{border:0}.bi span:first-child{flex:1}.bi .mu{font-size:12px}
.sub{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--ln)}
.sub button{background:none;border:0;border-bottom:3px solid transparent;padding:6px 14px;font:inherit;color:var(--mu);cursor:pointer}.sub button.on{color:var(--tx);font-weight:700;border-color:var(--ac)}
.seg{display:flex;border:1.5px solid var(--tx);border-radius:8px;overflow:hidden}.seg button{background:none;border:0;color:var(--tx);padding:7px 14px;font:inherit;cursor:pointer}.seg button.on{background:var(--tx);color:var(--bg)}
.case{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:14px 24px 0;margin-bottom:16px}
.shelf{display:flex;align-items:flex-end;gap:6px;padding:30px 18px 0;border-bottom:12px solid var(--tx);margin-bottom:22px;overflow-x:auto}
.spine{position:relative;display:flex;align-items:center;justify-content:center;border:0;border-radius:3px 3px 0 0;flex:none;cursor:pointer;padding:0;transition:transform .15s}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font:700 14px Georgia,serif;white-space:nowrap;max-height:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.spine i{position:absolute;left:0;bottom:0;height:5px;background:currentColor;opacity:.9}
.spine:hover{transform:translateY(-6px)}.spine.on{transform:translateY(-16px);outline:3px solid var(--ac);outline-offset:2px}
.spine.addsp{width:46px;height:200px;background:none;border:2px dashed var(--mu);border-bottom:0;color:var(--mu)}
.det{display:flex;gap:18px;align-items:center}.det.big{flex-direction:column;text-align:center;position:sticky;top:110px}.det.big .row{justify-content:center}
.mini{width:34px;height:48px;border-radius:2px 5px 5px 2px;flex:none}
.cov{width:150px;height:210px;border-radius:4px 10px 10px 4px;padding:18px 14px 14px 22px;display:flex;align-items:flex-end;text-align:left;font:700 22px/1.15 Georgia,serif;box-shadow:inset 8px 0 0 rgba(0,0,0,.22),0 6px 14px rgba(0,0,0,.2);overflow:hidden}
.dinfo{flex:1;min-width:0;display:grid;gap:6px;width:100%}.dt{font:700 20px Georgia,serif}.bar.big{height:8px;margin:2px 0}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media(max-width:820px){.lgrid{grid-template-columns:1fr}.det.big{position:static}}
.rowb{display:flex;align-items:center;gap:14px;width:100%;padding:8px 12px;border-radius:10px;border:1.5px solid transparent;background:none;color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.rowb:hover{background:var(--p2)}.rowb.on{background:var(--p);border-color:var(--ac)}
.rowb .m{width:36px;height:50px;border-radius:2px 5px 5px 2px;flex:none}.rt1{flex:1;min-width:0}.rt1 b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rt1 small{color:var(--mu)}
.rowb .bar{width:110px;margin:0;flex:none}.rowb .chip{width:86px;text-align:center;background:var(--p2);color:var(--tx);flex:none}
.tb{width:100%;border-collapse:collapse}.tb th,.tb td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln)}.tb th{color:var(--mu);font-weight:600;font-size:13px}
#reader{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.rbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 14px;border-bottom:2px solid var(--tx)}
.rt{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 16px Georgia,serif}
.rn{display:flex;gap:6px;align-items:center}.rn input{width:70px}.rn b{font:700 18px Georgia,serif;font-variant-numeric:tabular-nums}
#rview{flex:1;min-height:0;overflow:auto;padding:16px;background:var(--cell)}
.pdfp{display:block;margin:0 auto;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#rview iframe{width:100%;height:100%;border:0;display:block;background:#fff}
/* modo noite do leitor: inverte as cores da página (fundo escuro suave, texto claro, como no Kindle) e escurece a barra */
#reader.rdark{color-scheme:dark;color:var(--tx);--bg:#0c0c0c;--p:#171717;--p2:#222;--tx:#e6e6e6;--mu:#9a9a9a;--ln:#333;--cell:#000;--inp:#171717}
#reader.rdark .pdfp,#reader.rdark #rview iframe{filter:invert(.92) hue-rotate(180deg);box-shadow:none}
#rdark.on{background:var(--tx);color:var(--bg)}
#hadet summary{cursor:pointer;font:700 20px Georgia,serif;margin:22px 0 10px}.arq{opacity:.85}
.hlk{margin-top:8px}.hsel{max-width:100%}
/* celular: cabeçalho compacto (título + tema na 1ª linha, menu rolável na 2ª) */
@media(max-width:720px){
header{padding:6px 12px;gap:2px 10px}
h1{font-size:22px;flex:1}
#theme{padding:3px 10px;font-size:13px}
nav{order:3;flex:none;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;white-space:nowrap;padding:5px 10px;font-size:14px}
#sv{order:4;font-size:11px;line-height:1.2;text-align:left}
}
</style></head><body>
<header>
  <h1>Rotina</h1>
  <nav id="nav">
    <button data-tab="pomodoro">Pomodoro</button><button data-tab="dashboard">Dashboard</button><button data-tab="tarefas">Tarefas</button><button data-tab="habitos">Hábitos</button><button data-tab="biblioteca">Biblioteca</button><button data-tab="diario">Diário</button><button data-tab="config">⚙ Configurações</button>
  </nav>
  <button class="btn" id="theme" data-act="theme"></button>
  <div id="sv"></div>
</header>

<section class="view" id="v-pomodoro"><div class="pgrid"><div class="pmain">
  <div class="card" id="pomo">
    <div class="ring" id="ring"><div><span id="clock">25:00</span><span class="mu" id="pcount"></span></div></div>
    <div>
      <div id="modes"><button data-m="focus">Foco</button><button data-m="short">Pausa curta</button><button data-m="long">Pausa longa</button></div>
      <div class="row" style="margin-bottom:14px"><button class="btn pri" id="go" data-act="toggle">Iniciar</button><button class="btn" data-act="reset">Reiniciar</button><button class="btn" data-act="skip">Pular</button></div>
      <div id="ptask" class="row" style="margin-bottom:10px"></div>
      <select id="phab" aria-label="Hábito vinculado"></select>
      <div id="bsug" class="row bsug" hidden></div>
    </div>
  </div>
  <h2>Configurações</h2>
  <div class="card set">
    <label>Foco (min)<input type="number" min="1" data-set="focus"></label>
    <label>Pausa curta (min)<input type="number" min="1" data-set="short"></label>
    <label>Pausa longa (min)<input type="number" min="1" data-set="long"></label>
    <label>Focos até a pausa longa<input type="number" min="1" data-set="cycles"></label>
  </div>
</div>
  <aside class="pside"><div class="card">
    <b class="sh">Ideias para a pausa</b>
    <form class="row" id="fb"><input type="text" name="text" placeholder="Nova ideia (ex.: Alongar)" required>
      <select name="kind"><option value="any">Qualquer pausa</option><option value="short">Pausa curta</option><option value="long">Pausa longa</option></select>
      <button class="btn pri">Adicionar</button></form>
    <div id="blist"></div>
    <button class="btn sm" data-act="brestore" style="margin-top:10px">Restaurar recomendadas</button>
  </div></aside></div>
</section>

<section class="view" id="v-dashboard"><div id="dash"></div></section>

<section class="view" id="v-tarefas">
  <form class="card row" id="ft"><input type="text" name="title" placeholder="Nova tarefa" required><button class="btn pri">Adicionar tarefa</button></form>
  <div class="row" style="margin-bottom:12px"><span class="mu">Mostrar:</span>
    <select id="tf"><option value="abertas">Abertas</option><option value="pendente">Pendentes</option><option value="andamento">Em andamento</option><option value="feito">Feitas</option><option value="todas">Todas</option></select></div>
  <div id="tlist"></div>
</section>

<section class="view" id="v-habitos">
  <form class="card row" id="fh">
    <input type="text" name="name" placeholder="Novo hábito (ex.: Ler)" required>
    <input type="number" name="goal" min="0.01" step="any" value="1" title="Meta diária" aria-label="Meta diária">
    <select name="unit" id="hunit" title="Unidade de medida" aria-label="Unidade de medida"></select>
    <input type="text" name="unitc" id="hunitc" placeholder="Nome da unidade (ex.: km)" style="flex:0 1 190px;min-width:140px" hidden>
    <select name="link" id="hlinkf" class="hsel" title="Vincular à leitura" aria-label="Vincular à leitura"></select>
    <input type="color" name="color" value="#2f9e6b" title="Cor do painel">
    <button class="btn pri">Adicionar hábito</button>
  </form>
  <div id="hlist"></div>
  <div id="harch"></div>
</section>

<section class="view" id="v-diario">
  <form class="card" id="fd">
    <div class="row" style="margin-bottom:10px"><input type="date" name="date" required>
      <select name="mood"><option value="5">😄 Ótimo</option><option value="4" selected>🙂 Bem</option><option value="3">😐 Normal</option><option value="2">😕 Ruim</option><option value="1">😢 Péssimo</option></select></div>
    <textarea name="text" placeholder="Como foi o seu dia?" required></textarea>
    <div style="margin-top:10px"><button class="btn pri">Salvar nota</button></div>
  </form>
  <div class="dsum" id="dsum"></div>
  <input type="text" id="dq" placeholder="Buscar nas notas" style="width:100%;margin-bottom:12px">
  <div id="dlist"></div>
</section>

<section class="view" id="v-config"><div id="cfg"></div></section>
<section class="view" id="v-biblioteca"><div id="lib"></div></section>

<div id="reader" hidden>
  <div class="rbar">
    <button class="btn sm" data-act="rd-close">← Biblioteca</button><b class="rt" id="rtitle"></b>
    <span class="rn"><button class="btn sm" data-act="rd-prev" aria-label="Página anterior">◀</button><input type="number" id="rpg" min="1" aria-label="Página"><span class="mu" id="rtot"></span><button class="btn sm" data-act="rd-next" aria-label="Próxima página">▶</button></span>
    <span class="rn"><button class="btn sm" data-act="rd-zm" aria-label="Diminuir zoom">−</button><button class="btn sm" data-act="rd-zf">Ajustar</button><button class="btn sm" data-act="rd-zp" aria-label="Aumentar zoom">+</button></span>
    <button class="btn sm" id="rdark" data-act="rd-dark" aria-pressed="false" title="Inverter as cores da página (atalho: D)">☾ Modo noite</button>
    <span class="rn"><span class="mu">Leitura</span><b id="rtime">00:00</b><button class="btn sm" id="rdpause" data-act="rd-pause">Pausar</button></span>
    <span class="rn"><span class="mu" id="rmode"></span><b id="rclock">25:00</b><button class="btn sm" id="rgo" data-act="toggle">Iniciar</button><button class="btn sm" data-act="skip">Pular</button></span>
  </div>
  <div id="rview"></div>
</div>

let S,tab='pomodoro',P={mode:'focus',left:0,run:false,end:0,cycle:0,task:null,sug:null};

const MOODS={1:'😢',2:'😕',3:'😐',4:'🙂',5:'😄'};
const DEF=()=>({settings:{focus:25,short:5,long:15,cycles:4,theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light',tl:'salvia',td:'floresta',lang:'pt',fs:15,tab0:'pomodoro',shelf:'a',hm:12,ws:0,cs:12,lbl:true,snd:true,rdark:false},
  tasks:[],diary:[],themes:[],books:[],stats:{days:{}},
  breaksV:2,breaks:[['Beber um copo de água','any'],['Alongar pescoço, ombros e costas','any'],['Olhar para longe por 20 segundos (descansar os olhos)','short'],['Respirar fundo 5 vezes','short'],['Levantar e andar um pouco','any'],['Organizar a mesa de trabalho','short'],['Fazer um lanche leve','long'],['Dar uma volta lá fora','long'],['Alongar punhos e mãos','short'],['Pegar um pouco de luz natural na janela','any'],['Ouvir uma música de que você gosta','long'],['Anotar algo bom que aconteceu hoje','long']].map(([text,kind],i)=>({id:'b'+i,text,kind})),
  habits:[{id:uid(),name:'Estudar',type:'time',goal:120,unit:'min',color:'#3b82c4',log:{}},{id:uid(),name:'Beber água',type:'count',goal:8,unit:'copos',color:'#2f9e6b',log:{}}]});
const day=(d=today())=>S.stats.days[d]??={pomos:0,focusMin:0,tasksDone:0,readSec:0,readPages:0};
const val=(h,d)=>h.log[d]||0;
/* unidades de medida: as pré-definidas ficam salvas em português e são traduzidas na tela */
const UNITS=['páginas','minutos','horas','segundos','copos','vezes','repetições'];
const TS={min:60,mins:60,minuto:60,minutos:60,h:3600,hr:3600,hora:3600,horas:3600,s:1,seg:1,segundo:1,segundos:1};
const usec=u=>TS[String(u||'').trim().toLowerCase()]||0;            // segundos que 1 unidade de tempo vale (0 = não é unidade de tempo)
const ispg=u=>/^(p[áa]ginas?|pgs?|pags?)$/i.test(String(u||'').trim());
const tsec=h=>h.type=='time'?(usec(h.unit)||60):0;                    // hábitos antigos "por tempo" sem unidade reconhecida contam em minutos
const metric=h=>ispg(h.unit)?'pages':h.type=='time'?'time':null;      // o que a leitura pode somar neste hábito
const UL=u=>UNITS.includes(u)?_(u):u;
const fv=v=>+(+v).toFixed(2);                                          // mostra números sem lixo decimal
const addLog=(h,d,x)=>{h.log[d]=+(val(h,d)+x).toFixed(6)};
const activeH=()=>S.habits.filter(h=>!h.archived);
/* leitura -> hábitos vinculados: soma páginas novas ou segundos lidos no leitor */
function linkHab(b,by,x){activeH().forEach(h=>{if(!h.read||metric(h)!=by||(h.read.book!='all'&&h.read.book!=b.id))return;addLog(h,today(),by=='time'?x/tsec(h):x)})}
const dur=m=>S.settings[m]*60;
async function load(){
  let d=null;
  try{const r=await fetch('/api/data');if(!r.ok)throw 0;d=await r.json();if(!Object.keys(d).length)d=null}
  catch(e){try{d=JSON.parse(localStorage.getItem('rotina'))}catch(e){}}
  if(d&&d.breaks&&!d.breaksV)DEF().breaks.filter(b=>+b.id.slice(1)>=8&&!d.breaks.some(x=>x.id==b.id)).forEach(b=>d.breaks.push(b));
  S=Object.assign(DEF(),d||{});S.settings=Object.assign(DEF().settings,d?.settings);S.themes||=[];
}
function streak(h){let d=new Date(),n=0;if(val(h,iso(d))<h.goal)d.setDate(d.getDate()-1);while(val(h,iso(d))>=h.goal){n++;d.setDate(d.getDate()-1)}return n}
function best(h){let b=0,c=0,p=null;for(const d of Object.keys(h.log).filter(k=>h.log[k]>=h.goal).sort()){c=p&&new Date(d)-new Date(p)==864e5?c+1:1;b=Math.max(b,c);p=d}return b}
function summ(){const D=Object.values(S.stats.days);S.stats.resumo={atualizadoEm:new Date().toISOString(),pomodoros:sum(D,'pomos'),minutosFoco:sum(D,'focusMin'),
  tarefasFeitas:S.tasks.filter(k=>k.status=='feito').length,tarefasAbertas:S.tasks.filter(k=>k.status!='feito').length,notasDiario:S.diary.length,biblioteca:(()=>{const B=S.books||[];return{livros:B.length,lendo:B.filter(b=>bst(b)=='lendo').length,lidos:B.filter(b=>b.done).length,segundosLeitura:sum(D,'readSec'),paginasLidas:sum(D,'readPages')}})(),
  habitos:Object.fromEntries(activeH().map(h=>[h.name,{tipo:h.type,meta:h.goal,total:Object.values(h.log).reduce((a,b)=>a+b,0),diasMetaBatida:Object.values(h.log).filter(v=>v>=h.goal).length,sequenciaAtual:streak(h),melhorSequencia:best(h)}]))}}
let tm;
function save(){summ();localStorage.setItem('rotina',JSON.stringify(S));clearTimeout(tm);
  tm=setTimeout(async()=>{try{const r=await fetch('/api/data',{method:'POST',body:JSON.stringify(S)});if(!r.ok)throw 0;$('#sv').textContent=_('✓ Salvo em data/dados.json')}
  catch(e){$('#sv').textContent=_('⚠ Servidor off: salvo só neste navegador. Rode python server.py')}},300)}

function beep(){try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.6)}catch(e){}}
function pv(){const m=Math.floor(P.left/60),s=P.left%60,x=String(m).padStart(2,0)+':'+String(s).padStart(2,0);
  $('#clock').textContent=x;document.title=P.run?x+' · Rotina':'Rotina';$('#go').textContent=P.run?_('Pausar'):_('Iniciar');
  $('#rgo').textContent=P.run?_('Pausar'):_('Iniciar');$('#rclock').textContent=x;$('#rmode').textContent=_({focus:'Foco',short:'Pausa curta',long:'Pausa longa'}[P.mode]);
  $$('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m==P.mode));$('#ring').style.setProperty('--pg',(1-P.left/dur(P.mode))*360+'deg')}
function ptask(){const k=S.tasks.find(x=>x.id==P.task);$('#ptask').innerHTML=k?`<span>${_('Tarefa:')} <b>${esc(k.title)}</b></span><button class="btn sm" data-act="unlink">${_('Desvincular')}</button>`:`<span class="mu">${_('Nenhuma tarefa vinculada (inicie uma pela aba Tarefas)')}</span>`}
function setMode(m){P.mode=m;P.run=false;P.left=dur(m);if(m!='focus')pickBreak();pv();rBreak()}
function toggle(){if(P.run){P.left=Math.max(0,Math.ceil((P.end-Date.now())/1000));P.run=false}else{P.run=true;P.end=Date.now()+P.left*1000}pv()}
function next(){P.cycle++;setMode(P.cycle%S.settings.cycles?'short':'long')}
function fin(){P.run=false;if(S.settings.snd)beep();
  if(P.mode=='focus'){const m=S.settings.focus,d=day();d.pomos++;d.focusMin+=m;
    const k=S.tasks.find(x=>x.id==P.task);if(k){k.pomos=(k.pomos||0)+1;k.minutes=(k.minutes||0)+m}
    const h=activeH().find(x=>x.id==$('#phab').value);if(h)addLog(h,today(),m*60/(tsec(h)||60));
    next()}else setMode('focus');
  save();render()}
setInterval(()=>{if(!P.run)return;P.left=Math.max(0,Math.ceil((P.end-Date.now())/1000));pv();if(!P.left)fin()},250);
function rPomo(){$$('[data-set]').forEach(i=>i.value=S.settings[i.dataset.set]);
  const s=$('#phab'),c=s.value;s.innerHTML=`<option value="">${_('Não somar a nenhum hábito')}</option>`+activeH().filter(h=>h.type=='time'&&!h.read).map(h=>`<option value="${h.id}">${_('Somar foco em:')} ${esc(h.name)}</option>`).join('');s.value=c;
  ptask();$('#pcount').textContent=`🍅 ${(S.stats.days[today()]||{}).pomos||0} ${_('hoje')} · ${_('ciclo')} ${P.cycle%S.settings.cycles}/${S.settings.cycles}`;pv();
  rBreaks();if(P.mode!='focus'&&!S.breaks.some(b=>b.id==P.sug))pickBreak();rBreak()}

  const o=L.filter(b=>b.id!=P.sug),a=o.length?o:L;P.sug=a[Math.floor(Math.random()*a.length)].id}

/* ---------- mapa de calor dos hábitos ---------- */
const lv=(h,v)=>{const r=v/h.goal;return !v?0:r<.34?1:r<.67?2:r<1?3:4};
const LS=l=>l?`background:color-mix(in srgb,var(--c) ${[0,30,55,80,100][l]}%,var(--cell))`:'';
function heat(h,ed){const st=S.settings,e=new Date(),tk=today(),ws=st.ws,
    wn=i=>new Date(2024,0,7+(ws+i)%7).toLocaleDateString(LOC,{weekday:'short'}).replace('.',''),
    mn=d=>d.toLocaleDateString(LOC,{month:'short'}).replace('.','');
  const s=new Date(e);s.setMonth(s.getMonth()-st.hm);s.setDate(s.getDate()+1);s.setDate(s.getDate()-(s.getDay()-ws+7)%7);
  let c='',n=0,tot=0;
  for(const d=new Date(s);d<=e;){c+=`<b class="ml">${st.lbl&&d.getDate()<=7?mn(d):''}</b>`;
    for(let i=0;i<7;i++,d.setDate(d.getDate()+1)){if(d>e){c+='<i class="e"></i>';continue}
      const k=iso(d),v=val(h,k),cl=((ed?'ed ':'')+(k==tk?'td':'')).trim();if(v>=h.goal)n++;tot+=v;
      c+=`<i ${ed?'data-act="hday" ':''}${cl?`class="${cl}" `:''}data-d="${k}" title="${k}: ${fv(v)} ${esc(UL(h.unit))}" style="${LS(lv(h,v))}"></i>`}}
  const wd='<span></span>'+[0,1,2,3,4,5,6].map(i=>`<span>${st.lbl&&i%2?wn(i):''}</span>`).join('');
  return `<div class="hmw" style="--cs:${st.cs}px">${st.lbl?`<div class="wd">${wd}</div>`:''}<div class="heatw"><div class="heat">${c}</div></div></div>
  <div class="hl"><span>${n} ${_('dias com meta batida')} · ${_('melhor sequência')}: ${best(h)} · ${_('total')}: ${fv(tot)} ${esc(UL(h.unit))}${ed?' · '+_('Clique em um dia para editar'):''}</span>
  <span class="lg">${_('Menos')} ${[0,1,2,3,4].map(l=>`<i style="${LS(l)}"></i>`).join('')} ${_('Mais')}</span></div>`}

/* ---------- PDFs e leitor ---------- */
async function pdfjs(){if(PJ!==undefined)return PJ;
  try{PJ=await import('/libs/pdfjs/pdf.min.mjs');PJ.GlobalWorkerOptions.workerSrc='/libs/pdfjs/pdf.worker.min.mjs'}catch(e){PJ=null}return PJ}
const pdfUrl=b=>'/livros/'+encodeURIComponent(b.file);
async function addPdfs(files){let ok=0;
  for(const f of files){if(!/\.pdf$/i.test(f.name))continue;let nm;
    try{const r=await fetch('/api/livros?name='+encodeURIComponent(f.name),{method:'POST',body:f});if(!r.ok)throw 0;nm=(await r.json()).name}
    catch(e){alert(_('Não foi possível enviar o PDF. Rode python server.py e abra o site por http://localhost:8000.'));break}
    const b={id:uid(),title:f.name.replace(/\.pdf$/i,''),author:'',file:nm,pages:0,page:1,maxPage:1,pagesRead:0,readSec:0,color:S.books.length%BC.length,added:today(),last:0,done:false};
    try{const pj=await pdfjs();if(pj){const d=await pj.getDocument(pdfUrl(b)).promise;b.pages=d.numPages;d.destroy()}}catch(e){}
    S.books.push(b);LB.sel=b.id;ok++}
  if(ok){save();render()}}
async function openReader(id){const b=S.books.find(x=>x.id==id);if(!b)return;
  R={b,doc:null,sec:0,paused:false,tick:0,z:1,rt:0};b.last=Date.now();
  $('#reader').hidden=false;applyRd();document.body.style.overflow='hidden';$('#rtitle').textContent=b.title;$('#rtime').textContent='00:00';$('#rdpause').textContent=_('Pausar');$('#rview').innerHTML='';
  const pj=await pdfjs();
  if(pj){try{R.doc=await pj.getDocument(pdfUrl(b)).promise;b.pages=R.doc.numPages}catch(e){R.doc=null}}
  if(R&&R.b==b)await showPage(b.page)}
async function showPage(n){if(!R)return;const b=R.b,my=++R.rt;n=Math.max(1,Math.min(+n||1,b.pages||+n||1));const box=$('#rview');
  if(!R.doc){box.innerHTML=`<iframe src="${pdfUrl(b)}#page=${n}" title="PDF"></iframe>`;setPage(n);return}
  const pg=await R.doc.getPage(n);if(!R||my!=R.rt)return;const v0=pg.getViewport({scale:1}),sc=(box.clientWidth-32)/v0.width*R.z,dpr=window.devicePixelRatio||1,vp=pg.getViewport({scale:sc*dpr}),cv=document.createElement('canvas');
  cv.width=vp.width;cv.height=vp.height;cv.style.width=vp.width/dpr+'px';cv.style.height=vp.height/dpr+'px';cv.className='pdfp';
  await pg.render({canvasContext:cv.getContext('2d'),canvas:cv,viewport:vp}).promise;
  if(!R||my!=R.rt)return;box.replaceChildren(cv);box.scrollTop=0;setPage(n)}
function setPage(n){const b=R.b;b.page=n;
  if(n>b.maxPage){const d=n-b.maxPage;if(d<=3){b.pagesRead=(b.pagesRead||0)+d;const dd=day();dd.readPages=(dd.readPages||0)+d;linkHab(b,'pages',d)}b.maxPage=n}
  if(b.pages&&n>=b.pages)b.done=true;
  $('#rpg').value=n;$('#rtot').textContent='/ '+(b.pages||'?');save()}
function readerAct(a){if(!R)return;const b=R.b;
  if(a=='rd-close')return closeReader();
  if(a=='rd-prev')showPage(b.page-1);else if(a=='rd-next')showPage(b.page+1);
  else if(a=='rd-zp'){R.z=Math.min(4,R.z+.2);showPage(b.page)}else if(a=='rd-zm'){R.z=Math.max(.4,R.z-.2);showPage(b.page)}else if(a=='rd-zf'){R.z=1;showPage(b.page)}
  else if(a=='rd-pause'){R.paused=!R.paused;$('#rdpause').textContent=R.paused?_('Retomar'):_('Pausar')}
  else if(a=='rd-dark'){S.settings.rdark=!S.settings.rdark;applyRd();save()}}
function applyRd(){const on=!!S.settings.rdark;$('#reader').classList.toggle('rdark',on);$('#rdark').classList.toggle('on',on);$('#rdark').setAttribute('aria-pressed',on)}
function closeReader(){if(!R)return;R=null;$('#reader').hidden=true;document.body.style.overflow='';$('#rview').innerHTML='';save();render()}
setInterval(()=>{if(!R||R.paused||document.hidden)return;R.sec++;R.b.readSec=(R.b.readSec||0)+1;const d=day();d.readSec=(d.readSec||0)+1;linkHab(R.b,'time',1);$('#rtime').textContent=fmtC(R.sec);if(++R.tick%15==0)save()},1000);
document.addEventListener('keydown',e=>{if(!R||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.key=='ArrowRight'||e.key=='PageDown')readerAct('rd-next');else if(e.key=='ArrowLeft'||e.key=='PageUp')readerAct('rd-prev');else if(e.key=='Escape')closeReader();else if((e.key=='d'||e.key=='D')&&!e.ctrlKey&&!e.metaKey&&!e.altKey)readerAct('rd-dark')});
addEventListener('resize',()=>{if(R&&R.doc){clearTimeout(R.rz);R.rz=setTimeout(()=>R&&showPage(R.b.page),200)}});
addEventListener('pagehide',()=>{if(!S)return;summ();localStorage.setItem('rotina',JSON.stringify(S));navigator.sendBeacon&&navigator.sendBeacon('/api/data',JSON.stringify(S))});

    <div class="pv" id="thpv"><div class="pvc">${_('Exemplo de cartão')} · Aa</div><em></em></div><button class="btn pri">${_('Criar tema')}</button></form>
  <h2>${_('Visualização')}</h2><div class="card">
    ${row(_('Tamanho da fonte'),sel('fs',[[14,_('Pequena')],[15,'Normal'],[17,_('Grande')]],1))}
    ${row(_('Aba inicial'),sel('tab0',[['pomodoro','Pomodoro'],['dashboard','Dashboard'],['tarefas',_('Tarefas')],['habitos',_('Hábitos')],['biblioteca',_('Biblioteca')],['diario',_('Diário')]]))}
    ${row(_('Período do mapa de hábitos'),sel('hm',[[3,_('3 meses')],[6,_('6 meses')],[12,_('12 meses')]],1))}
    ${row(_('Semana começa em'),sel('ws',[[0,_('Domingo')],[1,_('Segunda-feira')]],1))}
    ${row(_('Tamanho das células'),sel('cs',[[10,_('Pequeno')],[12,_('Médio')],[15,_('Grande')]],1))}
    ${row(_('Mostrar rótulos de meses e dias'),chk('lbl',_('Mostrar rótulos de meses e dias')))}
    ${row(_('Tocar um bip quando o timer terminar'),chk('snd',_('Tocar um bip quando o timer terminar')))}</div>`;
  pvUpd()}
function pvUpd(){const f=$('#fth');if(!f)return;const g=n=>f.elements[n].value,p=$('#thpv');
  p.style.cssText=`background:${g('bg')};color:${g('tx')};border:1px solid ${g('ln')}`;p.firstElementChild.style.cssText=`background:${g('p')};border:1px solid ${g('ln')}`;p.lastElementChild.style.background=g('ac')}

/* ---------- núcleo ---------- */
function render(){({pomodoro:rPomo,dashboard:rDash,tarefas:rTasks,habitos:rHabits,diario:rDiary,config:rCfg,biblioteca:rLib})[tab]();
  $$('.heatw').forEach(x=>x.scrollLeft=x.scrollWidth);trDom()}
function go(n){tab=n;$$('.view').forEach(v=>v.classList.toggle('on',v.id=='v-'+n));$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab==n));render();
  const a=$('#nav .on'),nv=$('#nav');if(a)nv.scrollLeft+=a.getBoundingClientRect().left-nv.getBoundingClientRect().left-(nv.clientWidth-a.offsetWidth)/2}  // no celular o menu rola: deixa a aba ativa no meio
function defaults(){$('#fd [name=date]').value=today()}
function act(a,id,b){const tk=S.tasks.find(x=>x.id==id),h=S.habits.find(x=>x.id==id),bk=S.books.find(x=>x.id==id);
  if(a.startsWith('rd-'))return readerAct(a);
  if(a=='toggle')toggle();else if(a=='reset')setMode(P.mode);
  else if(a=='skip'){if(P.mode=='focus')next();else setMode('focus')}
  else if(a=='unlink')P.task=null;
  else if(a=='start')setSt(tk,'andamento');
  else if(a=='startp'){setSt(tk,'andamento');P.task=tk.id;setMode('focus');toggle();go('pomodoro')}
  else if(a=='done')setSt(tk,'feito');else if(a=='cycle')setSt(tk,NEXT[tk.status]);
  else if(a=='deltask'){if(!confirm(_('Excluir esta tarefa?')))return;S.tasks=S.tasks.filter(x=>x!=tk);if(P.task==id)P.task=null}
  else if(a=='hplus')h.log[today()]=val(h,today())+1;
  else if(a=='hminus')h.log[today()]=Math.max(0,val(h,today())-1);
  else if(a=='hadd')addLog(h,today(),+b.parentNode.querySelector('.amt').value||0);
  else if(a=='harch')h.archived=today();
  else if(a=='hunarch')delete h.archived;
  else if(a=='hday'){const d=b.dataset.d,v=prompt(`${d} · ${h.name} (${UL(h.unit)})`,fv(val(h,d)));if(v===null)return;const n=Math.max(0,+v.replace(',','.')||0);if(n)h.log[d]=n;else delete h.log[d]}
  else if(a=='delhab'){if(!confirm(_('Excluir este hábito e todo o histórico dele?')))return;S.habits=S.habits.filter(x=>x!=h)}
  else if(a=='deldiary')S.diary=S.diary.filter(x=>x.id!=id);
  else if(a=='delbreak'){S.breaks=S.breaks.filter(x=>x.id!=id);if(P.sug==id)P.sug=null}
  else if(a=='bnext')pickBreak();
  else if(a=='brestore')DEF().breaks.forEach(b=>{if(!S.breaks.some(x=>x.id==b.id))S.breaks.push(b)});
  else if(a=='theme'){S.settings.theme=S.settings.theme=='dark'?'light':'dark';tema()}
  else if(a=='settheme'){const x=allThemes()[b.dataset.th];S.settings.theme=x.m;S.settings[x.m=='dark'?'td':'tl']=b.dataset.th;tema()}
  else if(a=='delth'){const i=b.dataset.th;S.themes=S.themes.filter(x=>x.id!=i);if(S.settings.tl==i)S.settings.tl='salvia';if(S.settings.td==i)S.settings.td='floresta';tema()}
  else if(a=='lsub')LB.sub=b.dataset.v;
  else if(a=='shelfmode')S.settings.shelf=b.dataset.v;
  else if(a=='bsel')LB.sel=id;
  else if(a=='bopen'){LB.sel=id;openReader(id)}
  else if(a=='bpomo'){LB.sel=id;openReader(id);setMode('focus');toggle()}
  else if(a=='bedit'){const t=prompt(_('Título:'),bk.title);if(t===null)return;bk.title=t.trim()||bk.title;
    const au=prompt(_('Autor (opcional):'),bk.author||'');if(au!==null)bk.author=au.trim();
    const pg=prompt(_('Total de páginas (0 = automático):'),bk.pages||0);if(pg!==null&&+pg>=0)bk.pages=Math.floor(+pg)}
  else if(a=='bdone')bk.done=!bk.done;
  else if(a=='bdel'){if(!confirm(_('Remover este livro? O PDF também será apagado da pasta livros/.')))return;
    fetch('/api/livros?name='+encodeURIComponent(bk.file),{method:'DELETE'}).catch(()=>{});S.books=S.books.filter(x=>x!=bk);S.habits.forEach(x=>{if(x.read&&x.read.book==bk.id)delete x.read});if(LB.sel==id)LB.sel=null}
  save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)return act(b.dataset.act,b.closest('[data-id]')?.dataset.id,b);
  const n=e.target.closest('[data-tab]');if(n)return go(n.dataset.tab);const m=e.target.closest('[data-m]');if(m)setMode(m.dataset.m)});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f));
  if(f.id=='ft')S.tasks.unshift({id:uid(),title:v.title.trim(),status:'pendente',created:today(),pomos:0,minutes:0});
  else if(f.id=='fh'){const unit=(v.unit=='__c'?v.unitc:v.unit).trim()||'vezes',h={id:uid(),name:v.name.trim(),type:usec(unit)?'time':'count',goal:+v.goal||1,unit,color:v.color,log:{}};
    if(v.link){if(!metric(h)){alert(_('Para vincular à leitura, escolha a unidade "páginas" ou uma unidade de tempo (minutos, horas, segundos).'));return}h.read={book:v.link}}
    S.habits.push(h)}
  else if(f.id=='fd')S.diary.push({id:uid(),ts:Date.now(),date:v.date,mood:+v.mood,text:v.text.trim()});
  else if(f.id=='fb')S.breaks.push({id:uid(),text:v.text.trim(),kind:v.kind});
  else if(f.id=='fth'){const id='c'+uid();S.themes.push({id,n:v.name.trim(),m:v.m,c:[v.bg,v.p,v.tx,v.ac,v.ln]});S.settings.theme=v.m;S.settings[v.m=='dark'?'td':'tl']=id;tema()}
  f.reset();defaults();save();render()});
document.addEventListener('input',e=>{const x=e.target;
  if(x.matches('[data-col]')){const c=x.closest('[data-id]');S.habits.find(k=>k.id==c.dataset.id).color=x.value;c.style.setProperty('--c',x.value);save()}
  else if(x.matches('[data-cp]'))pvUpd();
  else if(x.id=='tf')rTasks();else if(x.id=='dq')rDiary();else if(x.id=='bq')$('#brows').innerHTML=bRows()});
document.addEventListener('change',e=>{const x=e.target;
  if(x.dataset.pdf!==undefined){const f=[...x.files];x.value='';addPdfs(f);return}
  if(x.id=='rpg'){showPage(+x.value||1);return}
  if(x.id=='hunit'){$('#hunitc').hidden=x.value!='__c';return}
  if(x.dataset.hlink!==undefined){const h=S.habits.find(k=>k.id==x.closest('[data-id]').dataset.id);if(x.value)h.read={book:x.value};else delete h.read;save();render();return}
  if(x.dataset.set){S.settings[x.dataset.set]=Math.max(1,+x.value||1);if(!P.run)P.left=dur(P.mode);save();pv()}
  else if(x.dataset.st){S.settings[x.dataset.st]=x.type=='checkbox'?x.checked:x.dataset.num?+x.value:x.value;aplicar();save();render()}});

document.addEventListener('toggle',e=>{if(e.target.id=='hadet')HAO=e.target.open},true);  // lembra se a seção de arquivados está aberta
(async()=>{await load();aplicar();P.left=dur('focus');defaults();go(S.settings.tab0);save()})();
</script></body></html>
