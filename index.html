<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biblioteca</title>
<style>
:root{--bg:#e3ebe3;--p:#f4f8f3;--p2:#e8f0e9;--tx:#17281f;--mu:#5d7066;--ac:#d9432b;--ln:#c4d2c8;--cell:#cfdcd2;--inp:#fff;color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
[data-theme=dark] .btn.pri{color:#0d0d0d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs,15px)/1.5 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 22px;border-bottom:2px solid var(--tx);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font:italic 700 28px Georgia,serif;margin:0}
h2{font:700 20px Georgia,serif;margin:22px 0 10px}
nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:6px 12px;font:inherit;color:var(--mu);cursor:pointer}
nav button.on{color:var(--tx);border-color:var(--ac);font-weight:700}
#sv{font-size:12px;color:var(--mu);width:100%;text-align:right}
.view{display:none;padding:22px;max-width:1000px;margin:auto}.view.on{display:block}
.card{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{margin:0}.stat b{display:block;font:700 32px Georgia,serif;color:var(--ac)}
.mu{color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--p);color:var(--tx);border:1.5px solid var(--tx);border-radius:8px;padding:7px 14px;cursor:pointer;font:inherit;transition:transform .12s,background .12s}
.btn:hover{background:var(--p2);transform:translateY(-1px)}
.btn:focus-visible,input:focus-visible,select:focus-visible,nav button:focus-visible,.sw:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn.sm{padding:3px 9px;border-color:var(--ln)}
input,select{background:var(--inp);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:7px 10px;font:inherit}
input[type=color]{padding:0;width:38px;height:32px;cursor:pointer}
input[type=number]{width:90px}
.chip{padding:1px 10px;border-radius:99px;font-size:12px;font-weight:700}
.bar{height:9px;background:var(--cell);border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--c,var(--ac))}
.hh{display:flex;justify-content:space-between;gap:10px}
.bars{display:flex;align-items:flex-end;gap:5px;height:160px}
.b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:var(--mu)}
.b i{width:100%;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}.b em{font-style:normal}
.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.swc{display:flex;gap:4px;align-items:flex-start}
.sw{flex:1;display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--p);color:var(--tx);border:1.5px solid var(--ln);border-radius:10px;padding:8px;cursor:pointer;font:inherit;text-align:left}
.sw.on{border-color:var(--ac);outline:2px solid var(--ac)}
.sp{display:flex;width:100%;height:26px;border-radius:6px;overflow:hidden;border:1px solid var(--ln)}.sp i{flex:1}
.crow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln)}.crow:last-child{border:0}
.cl{display:grid;gap:3px;font-size:12px;color:var(--mu);justify-items:start}
.pv{display:flex;align-items:center;gap:10px;padding:14px;border-radius:10px;margin:12px 0}.pvc{flex:1;padding:10px;border-radius:8px}.pv em{width:60px;height:26px;border-radius:6px}
[hidden]{display:none!important}
.sub{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--ln)}
.sub button{background:none;border:0;border-bottom:3px solid transparent;padding:6px 14px;font:inherit;color:var(--mu);cursor:pointer}.sub button.on{color:var(--tx);font-weight:700;border-color:var(--ac)}
.seg{display:flex;border:1.5px solid var(--tx);border-radius:8px;overflow:hidden}.seg button{background:none;border:0;color:var(--tx);padding:7px 14px;font:inherit;cursor:pointer}.seg button.on{background:var(--tx);color:var(--bg)}
.case{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:14px 24px 0;margin-bottom:16px}
.shelf{display:flex;align-items:flex-end;gap:6px;padding:30px 18px 0;border-bottom:12px solid var(--tx);margin-bottom:22px;overflow-x:auto}
.spine{position:relative;display:flex;align-items:center;justify-content:center;border:0;border-radius:3px 3px 0 0;flex:none;cursor:pointer;padding:0;transition:transform .15s}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font:700 14px Georgia,serif;white-space:nowrap;max-height:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.spine i{position:absolute;left:0;bottom:0;height:5px;background:currentColor;opacity:.9}
.spine:hover{transform:translateY(-6px)}.spine.on{transform:translateY(-16px);outline:3px solid var(--ac);outline-offset:2px}
.spine.addsp{width:46px;height:200px;background:none;border:2px dashed var(--mu);border-bottom:0;color:var(--mu)}
.det{display:flex;gap:18px;align-items:center}.det.big{flex-direction:column;text-align:center;position:sticky;top:110px}.det.big .row{justify-content:center}
.mini{width:34px;height:48px;border-radius:2px 5px 5px 2px;flex:none}
.cov{width:150px;height:210px;border-radius:4px 10px 10px 4px;padding:18px 14px 14px 22px;display:flex;align-items:flex-end;text-align:left;font:700 22px/1.15 Georgia,serif;box-shadow:inset 8px 0 0 rgba(0,0,0,.22),0 6px 14px rgba(0,0,0,.2);overflow:hidden}
.dinfo{flex:1;min-width:0;display:grid;gap:6px;width:100%}.dt{font:700 20px Georgia,serif}.bar.big{height:8px;margin:2px 0}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media(max-width:820px){.lgrid{grid-template-columns:1fr}.det.big{position:static}}
.rowb{display:flex;align-items:center;gap:14px;width:100%;padding:8px 12px;border-radius:10px;border:1.5px solid transparent;background:none;color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.rowb:hover{background:var(--p2)}.rowb.on{background:var(--p);border-color:var(--ac)}
.rowb .m{width:36px;height:50px;border-radius:2px 5px 5px 2px;flex:none}.rt1{flex:1;min-width:0}.rt1 b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rt1 small{color:var(--mu)}
.rowb .bar{width:110px;margin:0;flex:none}.rowb .chip{width:86px;text-align:center;background:var(--p2);color:var(--tx);flex:none}
.tb{width:100%;border-collapse:collapse}.tb th,.tb td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln)}.tb th{color:var(--mu);font-weight:600;font-size:13px}
#reader{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.rbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 14px;border-bottom:2px solid var(--tx)}
.rt{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 16px Georgia,serif}
.rn{display:flex;gap:6px;align-items:center}.rn input{width:70px}.rn b{font:700 18px Georgia,serif;font-variant-numeric:tabular-nums}
#rview{flex:1;min-height:0;overflow:auto;padding:16px;background:var(--cell)}
.pdfp{display:block;margin:0 auto;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#rview iframe{width:100%;height:100%;border:0;display:block;background:#fff}
/* modo noite do leitor: inverte as cores da página (fundo escuro suave, texto claro, como no Kindle) e escurece a barra */
#reader.rdark{color-scheme:dark;color:var(--tx);--bg:#0c0c0c;--p:#171717;--p2:#222;--tx:#e6e6e6;--mu:#9a9a9a;--ln:#333;--cell:#000;--inp:#171717}
#reader.rdark .pdfp,#reader.rdark #rview iframe{filter:invert(.92) hue-rotate(180deg);box-shadow:none}
#rdark.on{background:var(--tx);color:var(--bg)}
/* meta diária de leitura */
.gstrip{display:flex;gap:4px;margin-top:10px}.gstrip i{flex:1;max-width:28px;height:14px;border-radius:3px;background:var(--cell)}.gstrip i.td{outline:2px solid var(--tx);outline-offset:-1px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:40;box-shadow:0 6px 18px rgba(0,0,0,.3);max-width:90vw;text-align:center}
/* celular: cabeçalho compacto (título + tema na 1ª linha, menu rolável na 2ª) */
@media(max-width:720px){
header{padding:6px 12px;gap:2px 10px}
h1{font-size:22px;flex:1}
#theme{padding:3px 10px;font-size:13px}
nav{order:3;flex:none;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;white-space:nowrap;padding:5px 10px;font-size:14px}
#sv{order:4;font-size:11px;line-height:1.2;text-align:left}
}
</style></head><body>
<header>
  <h1>Biblioteca</h1>
  <nav id="nav">
    <button data-tab="biblioteca">Livros</button><button data-tab="config">⚙ Configurações</button>
  </nav>
  <button class="btn" id="theme" data-act="theme"></button>
  <div id="sv"></div>
</header>

<section class="view" id="v-biblioteca"><div id="lib"></div></section>
<section class="view" id="v-config"><div id="cfg"></div></section>

<div id="reader" hidden>
  <div class="rbar">
    <button class="btn sm" data-act="rd-close">← Biblioteca</button><b class="rt" id="rtitle"></b>
    <span class="rn"><button class="btn sm" data-act="rd-prev" aria-label="Página anterior">◀</button><input type="number" id="rpg" min="1" aria-label="Página"><span class="mu" id="rtot"></span><button class="btn sm" data-act="rd-next" aria-label="Próxima página">▶</button></span>
    <span class="rn"><button class="btn sm" data-act="rd-zm" aria-label="Diminuir zoom">−</button><button class="btn sm" data-act="rd-zf">Ajustar</button><button class="btn sm" data-act="rd-zp" aria-label="Aumentar zoom">+</button></span>
    <button class="btn sm" id="rdark" data-act="rd-dark" aria-pressed="false" title="Inverter as cores da página (atalho: D)">☾ Modo noite</button>
    <span class="rn"><span class="mu">Leitura</span><b id="rtime">00:00</b><button class="btn sm" id="rdpause" data-act="rd-pause">Pausar</button></span>
    <span class="rn" id="rgoalw" hidden><span class="mu">Meta</span><b id="rgoal"></b></span>
  </div>
  <div id="rview"></div>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const iso=d=>d.toLocaleDateString('sv'),today=()=>iso(new Date()),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=(a,k)=>a.reduce((s,x)=>s+(x[k]||0),0);
const fv=v=>+(+v).toFixed(1);  // números sem lixo decimal

/* ---------- idiomas: o texto-base é português; EN traduz ---------- */
let LANG='pt',LOC='pt-BR';
const EN={"Livros":"Books","Biblioteca":"Library","⚙ Configurações":"⚙ Settings","Configurações":"Settings",
"✓ Salvo em data/dados.json":"✓ Saved to data/dados.json","⚠ Servidor off: salvo só neste navegador. Rode python server.py":"⚠ Server off: saved in this browser only. Run python server.py","🌙 Tema escuro":"🌙 Dark theme","☀ Tema claro":"☀ Light theme",
"Sálvia":"Sage","Areia":"Sand","Céu":"Sky","Lavanda":"Lavender","Rosé":"Rosé","Floresta":"Forest","Meia-noite":"Midnight","Grafite":"Graphite","Ameixa":"Plum","Oceano":"Ocean",
"Idioma":"Language","Aparência":"Appearance","Temas claros":"Light themes","Temas escuros":"Dark themes","Escolher um tema muda para o modo claro ou escuro dele. O botão no topo alterna entre o seu tema claro e o seu tema escuro.":"Picking a theme switches to its light or dark mode. The button at the top toggles between your light theme and your dark theme.",
"Criar tema personalizado":"Create custom theme","Nome do tema":"Theme name","Claro":"Light","Escuro":"Dark","Fundo":"Background","Cartões":"Cards","Texto":"Text","Destaque":"Accent","Bordas":"Borders","Exemplo de cartão":"Sample card","Criar tema":"Create theme","Remover tema":"Remove theme",
"Visualização":"Display","Tamanho da fonte":"Font size","Pequena":"Small","Grande":"Large","Excluir":"Delete",
"Minha biblioteca":"My library","← Biblioteca":"← Library","Estante":"Shelf","Estatísticas":"Statistics","Lombadas":"Spines","Lista":"List","Adicionar PDF":"Add PDF","livros":"books","em leitura":"reading",
"Sua estante está vazia. Adicione um PDF para começar.":"Your shelf is empty. Add a PDF to get started.","página":"page","de":"of","lidos":"read","Continuar leitura":"Continue reading","Editar":"Edit","Reabrir":"Reopen","Marcar como lido":"Mark as read",
"Lendo":"Reading","Lido":"Read","Quero ler":"Want to read","Buscar na estante":"Search the shelf","Nenhum livro encontrado.":"No books found.","Tempo de leitura":"Reading time","Lido hoje":"Read today","Páginas lidas":"Pages read","Páginas por hora":"Pages per hour",
"Livros na estante":"Books on the shelf","Em leitura":"In progress","Livros lidos":"Books read","Tempo de leitura, últimos 14 dias (min)":"Reading time, last 14 days (min)","Páginas lidas, últimos 14 dias":"Pages read, last 14 days","Por livro":"By book","Livro":"Book","Tempo":"Time","Progresso":"Progress",
"Título:":"Title:","Autor (opcional):":"Author (optional):","Total de páginas (0 = automático):":"Total pages (0 = automatic):","Remover este livro? O PDF também será apagado da pasta livros/.":"Remove this book? The PDF will also be deleted from the livros/ folder.",
"Não foi possível enviar o PDF. Rode python server.py e abra o site por http://localhost:8000.":"Could not upload the PDF. Run python server.py and open the site at http://localhost:8000.",
"Página anterior":"Previous page","Próxima página":"Next page","Página":"Page","Diminuir zoom":"Zoom out","Aumentar zoom":"Zoom in","Ajustar":"Fit","Leitura":"Reading","Pausar":"Pause","Retomar":"Resume","☾ Modo noite":"☾ Night mode","Inverter as cores da página (atalho: D)":"Invert page colors (shortcut: D)",
"páginas":"pages","dias":"days","sequência:":"streak:","Meta":"Goal","Meta de hoje":"Today's goal","Meta diária":"Daily goal","minutos":"minutes","✓ Meta de hoje batida!":"✓ Today's goal reached!","🎉 Meta de hoje batida!":"🎉 Today's goal reached!",
"Sem meta definida. Coloque um valor ao lado para começar.":"No goal set. Enter a value next to it to start.","Últimos 14 dias":"Last 14 days","Dias com meta batida":"Days goal met","Sequência atual":"Current streak","Melhor sequência":"Best streak","Tipo da meta":"Goal type"};
const _=s=>LANG=='en'?(EN[s]??s):s;
function trDom(){const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){if(n.parentNode.closest('script,style'))continue;if(n.__o===undefined)n.__o=n.nodeValue;const k=n.__o.trim();if(k)n.nodeValue=n.__o.replace(k,()=>_(k))}
  $$('[placeholder],[title],[aria-label]').forEach(el=>['placeholder','title','aria-label'].forEach(a=>{if(!el.hasAttribute(a))return;el.__a??={};el.__a[a]??=el.getAttribute(a);el.setAttribute(a,_(el.__a[a]))}))}

/* ---------- temas: [fundo, cartões, texto, destaque, bordas] ---------- */
const PRE={salvia:{n:'Sálvia',m:'light',c:['#e3ebe3','#f4f8f3','#17281f','#d9432b','#c4d2c8']},areia:{n:'Areia',m:'light',c:['#efe7da','#faf6ee','#2e2416','#c2571a','#d8ccb8']},
 ceu:{n:'Céu',m:'light',c:['#e2edf7','#f5f9fd','#14263a','#2a6fdb','#bfd3e6']},lavanda:{n:'Lavanda',m:'light',c:['#ebe6f4','#f8f6fc','#251a3a','#7b3fd1','#d3c9e6']},rose:{n:'Rosé',m:'light',c:['#f6e6e9','#fdf6f7','#3a1a22','#d03a68','#e6c9d0']},
 floresta:{n:'Floresta',m:'dark',c:['#0f1913','#17241d','#e4efe7','#ff6a4d','#2c3f34']},meianoite:{n:'Meia-noite',m:'dark',c:['#0e1220','#161c30','#e3e8f7','#5b8cff','#29314f']},grafite:{n:'Grafite',m:'dark',c:['#161616','#202020','#ededed','#f5b942','#333333']},
 ameixa:{n:'Ameixa',m:'dark',c:['#1c1224','#261a31','#f0e6f7','#e86bd0','#3d2c4b']},oceano:{n:'Oceano',m:'dark',c:['#0b1a1f','#11262d','#dff2f2','#2ed3b7','#1f3b44']}};
const allThemes=()=>({...PRE,...Object.fromEntries((S.themes||[]).map(x=>[x.id,{...x,custom:1}]))});
function tema(){const s=S.settings,m=s.theme=='dark'?'dark':'light',A=allThemes(),th=A[s[m=='dark'?'td':'tl']]||A[m=='dark'?'floresta':'salvia'],r=document.documentElement,v=(k,x)=>r.style.setProperty('--'+k,x);
  ['bg','p','tx','ac','ln'].forEach((k,i)=>v(k,th.c[i]));
  v('mu','color-mix(in srgb,var(--tx) 62%,var(--bg))');v('p2','color-mix(in srgb,var(--p) 90%,var(--tx))');v('cell','color-mix(in srgb,var(--bg) 84%,var(--tx))');
  v('inp',m=='dark'?'color-mix(in srgb,var(--p) 85%,var(--bg))':'color-mix(in srgb,var(--p) 50%,#fff)');
  r.dataset.theme=m;$('#theme').textContent=m=='dark'?_('☀ Tema claro'):_('🌙 Tema escuro')}
function aplicar(){const s=S.settings;LANG=s.lang=='en'?'en':'pt';LOC=LANG=='en'?'en-US':'pt-BR';document.documentElement.lang=LANG=='en'?'en':'pt-BR';
  document.documentElement.style.setProperty('--fs',s.fs+'px');tema()}

/* ---------- dados ----------
   O formato de data/dados.json é o mesmo da versão completa do site (branch main): chaves que esta versão não usa
   (hábitos, tarefas, diário...) são mantidas como estão ao salvar, então dá para alternar entre as duas sem perder nada. */
let S,tab='biblioteca';
const DEF=()=>({settings:{theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light',tl:'salvia',td:'floresta',lang:'pt',fs:15,shelf:'a',rdark:false,goal:30,goalType:'min'},
  themes:[],books:[],stats:{days:{}}});
// mesmos campos da versão completa (pomodoro/tarefas), para a outra versão não receber NaN em dias criados aqui
const day=(d=today())=>S.stats.days[d]??={pomos:0,focusMin:0,tasksDone:0,readSec:0,readPages:0};
async function load(){
  let d=null;
  try{const r=await fetch('/api/data');if(!r.ok)throw 0;d=await r.json();if(!Object.keys(d).length)d=null}
  catch(e){try{d=JSON.parse(localStorage.getItem('rotina'))}catch(e){}}
  S=Object.assign(DEF(),d||{});S.settings=Object.assign(DEF().settings,d?.settings);S.themes||=[];S.books||=[];S.stats||={days:{}};S.stats.days||={};
}

/* ---------- meta diária de leitura (em minutos ou em páginas) ---------- */
const goalU=()=>S.settings.goalType=='pages'?_('páginas'):_('min');
const gp=d=>{const x=S.stats.days[d]||{};return S.settings.goalType=='pages'?(x.readPages||0):(x.readSec||0)/60};   // progresso do dia
const gmet=d=>S.settings.goal>0&&gp(d)>=S.settings.goal;
function gstreak(){const d=new Date();if(!gmet(iso(d)))d.setDate(d.getDate()-1);let n=0;while(gmet(iso(d))){n++;d.setDate(d.getDate()-1)}return n}
function gbest(){let b=0,c=0,p=null;for(const d of Object.keys(S.stats.days).filter(k=>gmet(k)).sort()){c=p&&new Date(d)-new Date(p)==864e5?c+1:1;b=Math.max(b,c);p=d}return b}
const gdays=()=>Object.keys(S.stats.days).filter(k=>gmet(k)).length;
let tt;function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.append(t)}
  t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,4000)}
function gstrip(){const g=S.settings.goal,td=today();
  return `<div class="gstrip">${lastN(14).map(d=>{const v=gp(d),r=g>0?v/g:0,l=!v?0:r<.5?1:r<1?2:3;
    return `<i${d==td?' class="td"':''} title="${d}: ${fv(v)} ${goalU()}"${l?` style="background:${l==3?'#2f9e6b':`color-mix(in srgb,var(--ac) ${[0,35,65][l]}%,var(--cell))`}"`:''}></i>`}).join('')}</div>
  <div class="mu" style="font-size:12px;margin-top:4px">${_('Últimos 14 dias')}</div>`}
function goalCard(){const s=S.settings,g=s.goal,p=gp(today()),met=gmet(today());
  return `<div class="card goal"><div class="hh" style="flex-wrap:wrap;align-items:center"><div><b class="dt">${_('Meta de hoje')}</b>
    <div class="mu">${g>0?`${Math.floor(p)}/${fv(g)} ${goalU()} · ${_('sequência:')} ${gstreak()} ${_('dias')}${met?' · '+_('✓ Meta de hoje batida!'):''}`:_('Sem meta definida. Coloque um valor ao lado para começar.')}</div></div>
    <div class="row"><label class="mu" for="gv">${_('Meta diária')}</label><input type="number" id="gv" min="0" step="any" value="${g}" style="width:80px">
      <select id="gu" aria-label="${_('Tipo da meta')}"><option value="min"${s.goalType!='pages'?' selected':''}>${_('minutos')}</option><option value="pages"${s.goalType=='pages'?' selected':''}>${_('páginas')}</option></select></div></div>
  ${g>0?`<div class="bar" style="--c:${met?'#2f9e6b':'var(--ac)'}"><i style="width:${Math.min(100,p/g*100)}%"></i></div>${gstrip()}`:''}</div>`}

function summ(){const D=Object.values(S.stats.days),B=S.books;
  S.stats.resumo={atualizadoEm:new Date().toISOString(),
    biblioteca:{livros:B.length,lendo:B.filter(b=>bst(b)=='lendo').length,lidos:B.filter(b=>b.done).length,segundosLeitura:sum(D,'readSec'),paginasLidas:sum(D,'readPages')},
    metaDiaria:{tipo:S.settings.goalType,meta:S.settings.goal,diasComMetaBatida:gdays(),sequenciaAtual:gstreak(),melhorSequencia:gbest()}}}
let tm;
function save(){summ();localStorage.setItem('rotina',JSON.stringify(S));clearTimeout(tm);
  tm=setTimeout(async()=>{try{const r=await fetch('/api/data',{method:'POST',body:JSON.stringify(S)});if(!r.ok)throw 0;$('#sv').textContent=_('✓ Salvo em data/dados.json')}
  catch(e){$('#sv').textContent=_('⚠ Servidor off: salvo só neste navegador. Rode python server.py')}},300)}

/* ---------- biblioteca ---------- */
const BC=[['#2a62a0','#fff'],['#1f7a52','#fff'],['#c23a22','#fff'],['#6a35b8','#fff'],['#e0a21a','#17281f'],['#3d4a63','#fff'],['#1d6f77','#fff'],['#8a4b14','#fff']];
const PLUS='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true" style="vertical-align:-3px"><path d="M12 5v14M5 12h14"/></svg>';
let LB={sel:null,sub:'estante'},R=null,PJ;
const hash=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0),0);
const pct=b=>b.done?100:b.pages?Math.round(Math.min(100,b.page/b.pages*100)):0;
const bst=b=>b.done?'lido':(b.readSec>0||b.page>1)?'lendo':'quero';
const bstl=b=>_({lido:'Lido',lendo:'Lendo',quero:'Quero ler'}[bst(b)]);
const fmtT=s=>s>=3600?`${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}min`:`${Math.floor(s/60)} min`;
const fmtC=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+':'+String(m).padStart(2,0):m)+':'+String(s%60).padStart(2,0)};
const lastN=n=>[...Array(n)].map((x,i)=>{const d=new Date();d.setDate(d.getDate()-(n-1)+i);return iso(d)});
function barsOf(k,f=x=>x){const D=S.stats.days,L=lastN(14),m=Math.max(1,...L.map(x=>f((D[x]||{})[k]||0)));
  return `<div class="bars">${L.map(d=>{const v=f((D[d]||{})[k]||0);return `<div class="b"><em>${v||''}</em><i style="height:${v/m*110}px"></i><span>${d.slice(8)}</span></div>`}).join('')}</div>`}
const selBook=()=>S.books.find(b=>b.id==LB.sel)||[...S.books].sort((a,b)=>(b.last||0)-(a.last||0))[0];

function rLib(){const n=S.books.length,m=S.books.filter(b=>bst(b)=='lendo').length,sh=S.settings.shelf=='c'?'c':'a',sub=LB.sub;
  const tabs=[['estante','Estante'],['stats','Estatísticas']].map(([k,l])=>`<button class="${sub==k?'on':''}" data-act="lsub" data-v="${k}">${_(l)}</button>`).join('');
  const mode=sub=='estante'?`<div class="seg" role="group">${[['a','Lombadas'],['c','Lista']].map(([k,l])=>`<button class="${sh==k?'on':''}" data-act="shelfmode" data-v="${k}">${_(l)}</button>`).join('')}</div>`:'';
  $('#lib').innerHTML=goalCard()+`<div class="hh" style="align-items:flex-end;flex-wrap:wrap;margin-bottom:14px"><div><h2 style="margin:0">${_('Minha biblioteca')}</h2><div class="mu">${n} ${_('livros')} · ${m} ${_('em leitura')}</div></div>
  <div class="row">${mode}<label class="btn pri">${PLUS} ${_('Adicionar PDF')}<input type="file" accept="application/pdf" multiple hidden data-pdf></label></div></div>
  <div class="sub">${tabs}</div>`+(sub=='estante'?(sh=='a'?shelfA():shelfC()):rLibStats())}

function spine(b){const c=BC[b.color%BC.length],w=Math.max(36,Math.min(58,30+Math.round((b.pages||150)/14))),h=170+hash(b.id)%61;
  return `<button class="spine${LB.sel==b.id?' on':''}" data-act="bsel" data-id="${b.id}" style="width:${w}px;height:${h}px;background:${c[0]};color:${c[1]}" title="${esc(b.title)}"><span>${esc(b.title)}</span><i style="width:${pct(b)}%"></i></button>`}
function shelfA(){const sb=selBook();if(sb)LB.sel=sb.id;
  const it=[...S.books.map(spine),`<label class="spine addsp" title="${_('Adicionar PDF')}">${PLUS}<input type="file" accept="application/pdf" multiple hidden data-pdf></label>`],rows=[];
  for(let i=0;i<it.length;i+=14)rows.push(it.slice(i,i+14));
  return `<div class="case">${rows.map(r=>`<div class="shelf">${r.join('')}</div>`).join('')}</div>${sb?bDetail(sb,false):`<p class="mu">${_('Sua estante está vazia. Adicione um PDF para começar.')}</p>`}`}
function bDetail(b,big){const c=BC[b.color%BC.length],p=pct(b);
  return `<div class="card det${big?' big':''}" data-id="${b.id}"><div class="${big?'cov':'mini'}" style="background:${c[0]};color:${c[1]}">${big?esc(b.title):''}</div>
  <div class="dinfo"><div class="dt">${esc(b.title)}</div><div class="mu">${esc(b.author||'')}</div>
  <div class="mu">${b.pages?`${_('página')} ${b.page} ${_('de')} ${b.pages} · ${p}%`:`${_('página')} ${b.page}`} · ${fmtT(b.readSec||0)} ${_('lidos')} · ${bstl(b)}</div>
  ${b.pages?`<div class="bar big" style="--c:${c[0]}"><i style="width:${p}%"></i></div>`:''}
  <div class="row"><button class="btn pri" data-act="bopen">${_('Continuar leitura')}</button><button class="btn sm" data-act="bedit">${_('Editar')}</button><button class="btn sm" data-act="bdone">${b.done?_('Reabrir'):_('Marcar como lido')}</button><button class="btn sm" data-act="bdel" aria-label="${_('Excluir')}">🗑</button></div></div></div>`}
function bRows(){const q=($('#bq')?.value||'').toLowerCase();
  return S.books.filter(b=>!q||(b.title+' '+(b.author||'')).toLowerCase().includes(q)).map(b=>{const c=BC[b.color%BC.length];
    return `<button class="rowb${LB.sel==b.id?' on':''}" data-act="bsel" data-id="${b.id}"><span class="m" style="background:${c[0]}"></span><span class="rt1"><b>${esc(b.title)}</b><small>${esc(b.author||'')}</small></span><span class="bar" style="--c:${c[0]}"><i style="width:${pct(b)}%"></i></span><span class="chip">${bstl(b)}</span></button>`}).join('')||`<p class="mu">${_('Nenhum livro encontrado.')}</p>`}
function shelfC(){const sb=selBook();if(sb)LB.sel=sb.id;
  return `<div class="lgrid"><div><input id="bq" type="text" placeholder="${_('Buscar na estante')}" aria-label="${_('Buscar na estante')}" style="width:100%;margin-bottom:8px"><div id="brows">${bRows()}</div></div>${sb?bDetail(sb,true):`<p class="mu">${_('Sua estante está vazia. Adicione um PDF para começar.')}</p>`}</div>`}
function rLibStats(){const D=S.stats.days,V=Object.values(D),tot=sum(V,'readSec'),pg=sum(V,'readPages'),B=S.books;
  const C=[['Tempo de leitura',fmtT(tot)],['Lido hoje',fmtT((D[today()]||{}).readSec||0)],['Páginas lidas',pg],['Páginas por hora',tot>600?(pg/(tot/3600)).toFixed(1):'–'],
    ['Dias com meta batida',gdays()],['Sequência atual',gstreak()+' '+_('dias')],['Melhor sequência',gbest()+' '+_('dias')],
    ['Livros na estante',B.length],['Em leitura',B.filter(b=>bst(b)=='lendo').length],['Livros lidos',B.filter(b=>b.done).length]];
  return `<div class="grid">${C.map(c=>`<div class="card stat"><b>${c[1]}</b>${_(c[0])}</div>`).join('')}</div>
  <h2>${_('Tempo de leitura, últimos 14 dias (min)')}</h2><div class="card">${barsOf('readSec',x=>Math.round(x/60))}</div>
  <h2>${_('Páginas lidas, últimos 14 dias')}</h2><div class="card">${barsOf('readPages')}</div>
  <h2>${_('Por livro')}</h2><div class="card" style="overflow-x:auto"><table class="tb"><thead><tr><th>${_('Livro')}</th><th>${_('Tempo')}</th><th>${_('Páginas lidas')}</th><th>${_('Progresso')}</th></tr></thead>
  <tbody>${B.map(b=>`<tr><td>${esc(b.title)}</td><td>${fmtT(b.readSec||0)}</td><td>${b.pagesRead||0}</td><td>${pct(b)}%</td></tr>`).join('')}</tbody></table></div>`}

/* ---------- PDFs e leitor ---------- */
async function pdfjs(){if(PJ!==undefined)return PJ;
  try{PJ=await import('/libs/pdfjs/pdf.min.mjs');PJ.GlobalWorkerOptions.workerSrc='/libs/pdfjs/pdf.worker.min.mjs'}catch(e){PJ=null}return PJ}
const pdfUrl=b=>'/livros/'+encodeURIComponent(b.file);
async function addPdfs(files){let ok=0;
  for(const f of files){if(!/\.pdf$/i.test(f.name))continue;let nm;
    try{const r=await fetch('/api/livros?name='+encodeURIComponent(f.name),{method:'POST',body:f});if(!r.ok)throw 0;nm=(await r.json()).name}
    catch(e){alert(_('Não foi possível enviar o PDF. Rode python server.py e abra o site por http://localhost:8000.'));break}
    const b={id:uid(),title:f.name.replace(/\.pdf$/i,''),author:'',file:nm,pages:0,page:1,maxPage:1,pagesRead:0,readSec:0,color:S.books.length%BC.length,added:today(),last:0,done:false};
    try{const pj=await pdfjs();if(pj){const d=await pj.getDocument(pdfUrl(b)).promise;b.pages=d.numPages;d.destroy()}}catch(e){}
    S.books.push(b);LB.sel=b.id;ok++}
  if(ok){save();render()}}
async function openReader(id){const b=S.books.find(x=>x.id==id);if(!b)return;
  R={b,doc:null,sec:0,paused:false,tick:0,z:1,rt:0,gmet:gmet(today())};b.last=Date.now();
  $('#reader').hidden=false;applyRd();rgoal();document.body.style.overflow='hidden';$('#rtitle').textContent=b.title;$('#rtime').textContent='00:00';$('#rdpause').textContent=_('Pausar');$('#rview').innerHTML='';
  const pj=await pdfjs();
  if(pj){try{R.doc=await pj.getDocument(pdfUrl(b)).promise;b.pages=R.doc.numPages}catch(e){R.doc=null}}
  if(R&&R.b==b)await showPage(b.page)}
async function showPage(n){if(!R)return;const b=R.b,my=++R.rt;n=Math.max(1,Math.min(+n||1,b.pages||+n||1));const box=$('#rview');
  if(!R.doc){box.innerHTML=`<iframe src="${pdfUrl(b)}#page=${n}" title="PDF"></iframe>`;setPage(n);return}
  const pg=await R.doc.getPage(n);if(!R||my!=R.rt)return;const v0=pg.getViewport({scale:1}),sc=(box.clientWidth-32)/v0.width*R.z,dpr=window.devicePixelRatio||1,vp=pg.getViewport({scale:sc*dpr}),cv=document.createElement('canvas');
  cv.width=vp.width;cv.height=vp.height;cv.style.width=vp.width/dpr+'px';cv.style.height=vp.height/dpr+'px';cv.className='pdfp';
  await pg.render({canvasContext:cv.getContext('2d'),canvas:cv,viewport:vp}).promise;
  if(!R||my!=R.rt)return;box.replaceChildren(cv);box.scrollTop=0;setPage(n)}
function setPage(n){const b=R.b;b.page=n;
  if(n>b.maxPage){const d=n-b.maxPage;if(d<=3){b.pagesRead=(b.pagesRead||0)+d;const dd=day();dd.readPages=(dd.readPages||0)+d}b.maxPage=n}
  if(b.pages&&n>=b.pages)b.done=true;
  $('#rpg').value=n;$('#rtot').textContent='/ '+(b.pages||'?');rgoal();save()}
/* meta na barra do leitor; avisa uma vez quando a meta do dia é batida */
function rgoal(){if(!R)return;const g=S.settings.goal,w=$('#rgoalw');w.hidden=!(g>0);if(!(g>0))return;
  const met=gmet(today());$('#rgoal').textContent=`${Math.floor(gp(today()))}/${fv(g)} ${goalU()}${met?' ✓':''}`;
  if(met&&!R.gmet){R.gmet=true;toast(_('🎉 Meta de hoje batida!'))}}
function readerAct(a){if(!R)return;const b=R.b;
  if(a=='rd-close')return closeReader();
  if(a=='rd-prev')showPage(b.page-1);else if(a=='rd-next')showPage(b.page+1);
  else if(a=='rd-zp'){R.z=Math.min(4,R.z+.2);showPage(b.page)}else if(a=='rd-zm'){R.z=Math.max(.4,R.z-.2);showPage(b.page)}else if(a=='rd-zf'){R.z=1;showPage(b.page)}
  else if(a=='rd-pause'){R.paused=!R.paused;$('#rdpause').textContent=R.paused?_('Retomar'):_('Pausar')}
  else if(a=='rd-dark'){S.settings.rdark=!S.settings.rdark;applyRd();save()}}
function applyRd(){const on=!!S.settings.rdark;$('#reader').classList.toggle('rdark',on);$('#rdark').classList.toggle('on',on);$('#rdark').setAttribute('aria-pressed',on)}
function closeReader(){if(!R)return;R=null;$('#reader').hidden=true;document.body.style.overflow='';$('#rview').innerHTML='';save();render()}
setInterval(()=>{if(!R||R.paused||document.hidden)return;R.sec++;R.b.readSec=(R.b.readSec||0)+1;const d=day();d.readSec=(d.readSec||0)+1;$('#rtime').textContent=fmtC(R.sec);rgoal();if(++R.tick%15==0)save()},1000);
document.addEventListener('keydown',e=>{if(!R||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.key=='ArrowRight'||e.key=='PageDown')readerAct('rd-next');else if(e.key=='ArrowLeft'||e.key=='PageUp')readerAct('rd-prev');else if(e.key=='Escape')closeReader();else if((e.key=='d'||e.key=='D')&&!e.ctrlKey&&!e.metaKey&&!e.altKey)readerAct('rd-dark')});
addEventListener('resize',()=>{if(R&&R.doc){clearTimeout(R.rz);R.rz=setTimeout(()=>R&&showPage(R.b.page),200)}});
addEventListener('pagehide',()=>{if(!S)return;summ();localStorage.setItem('rotina',JSON.stringify(S));navigator.sendBeacon&&navigator.sendBeacon('/api/data',JSON.stringify(S))});

/* ---------- configurações ---------- */
function rCfg(){const s=S.settings,A=allThemes(),cur=A[s[s.theme=='dark'?'td':'tl']]||PRE.salvia;
  const sel=(k,o,num)=>`<select data-st="${k}"${num?' data-num="1"':''}>${o.map(([v,l])=>`<option value="${v}"${String(s[k])==String(v)?' selected':''}>${l}</option>`).join('')}</select>`;
  const row=(l,c)=>`<div class="crow"><span>${l}</span>${c}</div>`;
  const sw=m=>`<div class="sws">${Object.entries(A).filter(([,x])=>x.m==m).map(([id,x])=>`<div class="swc"><button class="sw${s.theme==m&&s[m=='dark'?'td':'tl']==id?' on':''}" data-act="settheme" data-th="${id}"><span class="sp">${[0,1,3,2].map(i=>`<i style="background:${x.c[i]}"></i>`).join('')}</span>${esc(x.custom?x.n:_(x.n))}</button>${x.custom?`<button class="btn sm" data-act="delth" data-th="${id}" aria-label="${_('Remover tema')}">✕</button>`:''}</div>`).join('')}</div>`;
  const pk=[['bg','Fundo'],['p','Cartões'],['tx','Texto'],['ac','Destaque'],['ln','Bordas']];
  $('#cfg').innerHTML=`<h2>${_('Idioma')}</h2><div class="card">${row(_('Idioma'),sel('lang',[['pt','Português'],['en','English']]))}</div>
  <h2>${_('Aparência')}</h2><div class="card"><p class="mu" style="margin-top:0">${_('Escolher um tema muda para o modo claro ou escuro dele. O botão no topo alterna entre o seu tema claro e o seu tema escuro.')}</p>
    <b>${_('Temas claros')}</b>${sw('light')}<b style="display:block;margin-top:16px">${_('Temas escuros')}</b>${sw('dark')}</div>
  <h2>${_('Criar tema personalizado')}</h2>
  <form class="card" id="fth"><div class="row" style="margin-bottom:12px"><input type="text" name="name" placeholder="${_('Nome do tema')}" required style="flex:1;min-width:180px"><select name="m"><option value="light">${_('Claro')}</option><option value="dark">${_('Escuro')}</option></select></div>
    <div class="row" style="gap:18px">${pk.map(([k,l],i)=>`<label class="cl">${_(l)}<input type="color" name="${k}" data-cp value="${cur.c[i]}"></label>`).join('')}</div>
    <div class="pv" id="thpv"><div class="pvc">${_('Exemplo de cartão')} · Aa</div><em></em></div><button class="btn pri">${_('Criar tema')}</button></form>
  <h2>${_('Visualização')}</h2><div class="card">
    ${row(_('Tamanho da fonte'),sel('fs',[[14,_('Pequena')],[15,'Normal'],[17,_('Grande')]],1))}</div>`;
  pvUpd()}
function pvUpd(){const f=$('#fth');if(!f)return;const g=n=>f.elements[n].value,p=$('#thpv');
  p.style.cssText=`background:${g('bg')};color:${g('tx')};border:1px solid ${g('ln')}`;p.firstElementChild.style.cssText=`background:${g('p')};border:1px solid ${g('ln')}`;p.lastElementChild.style.background=g('ac')}

/* ---------- núcleo ---------- */
function render(){({config:rCfg,biblioteca:rLib})[tab]();trDom()}
function go(n){n=n=='config'?'config':'biblioteca';tab=n;$$('.view').forEach(v=>v.classList.toggle('on',v.id=='v-'+n));$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab==n));render();
  const a=$('#nav .on'),nv=$('#nav');if(a)nv.scrollLeft+=a.getBoundingClientRect().left-nv.getBoundingClientRect().left-(nv.clientWidth-a.offsetWidth)/2}  // no celular o menu rola: deixa a aba ativa no meio
function act(a,id,b){const bk=S.books.find(x=>x.id==id);
  if(a.startsWith('rd-'))return readerAct(a);
  if(a=='theme'){S.settings.theme=S.settings.theme=='dark'?'light':'dark';tema()}
  else if(a=='settheme'){const x=allThemes()[b.dataset.th];S.settings.theme=x.m;S.settings[x.m=='dark'?'td':'tl']=b.dataset.th;tema()}
  else if(a=='delth'){const i=b.dataset.th;S.themes=S.themes.filter(x=>x.id!=i);if(S.settings.tl==i)S.settings.tl='salvia';if(S.settings.td==i)S.settings.td='floresta';tema()}
  else if(a=='lsub')LB.sub=b.dataset.v;
  else if(a=='shelfmode')S.settings.shelf=b.dataset.v;
  else if(a=='bsel')LB.sel=id;
  else if(a=='bopen'){LB.sel=id;openReader(id)}
  else if(a=='bedit'){const t=prompt(_('Título:'),bk.title);if(t===null)return;bk.title=t.trim()||bk.title;
    const au=prompt(_('Autor (opcional):'),bk.author||'');if(au!==null)bk.author=au.trim();
    const pg=prompt(_('Total de páginas (0 = automático):'),bk.pages||0);if(pg!==null&&+pg>=0)bk.pages=Math.floor(+pg)}
  else if(a=='bdone')bk.done=!bk.done;
  else if(a=='bdel'){if(!confirm(_('Remover este livro? O PDF também será apagado da pasta livros/.')))return;
    fetch('/api/livros?name='+encodeURIComponent(bk.file),{method:'DELETE'}).catch(()=>{});S.books=S.books.filter(x=>x!=bk);
    (S.habits||[]).forEach(x=>{if(x.read&&x.read.book==bk.id)delete x.read});  // só existe se o dados.json veio da versão completa: desfaz vínculos de hábitos a este livro
    if(LB.sel==id)LB.sel=null}
  save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)return act(b.dataset.act,b.closest('[data-id]')?.dataset.id,b);
  const n=e.target.closest('[data-tab]');if(n)return go(n.dataset.tab)});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f));
  if(f.id=='fth'){const id='c'+uid();S.themes.push({id,n:v.name.trim(),m:v.m,c:[v.bg,v.p,v.tx,v.ac,v.ln]});S.settings.theme=v.m;S.settings[v.m=='dark'?'td':'tl']=id;tema()}
  f.reset();save();render()});
document.addEventListener('input',e=>{const x=e.target;
  if(x.matches('[data-cp]'))pvUpd();
  else if(x.id=='bq')$('#brows').innerHTML=bRows()});
document.addEventListener('change',e=>{const x=e.target;
  if(x.dataset.pdf!==undefined){const f=[...x.files];x.value='';addPdfs(f);return}
  if(x.id=='rpg'){showPage(+x.value||1);return}
  if(x.id=='gv'){S.settings.goal=Math.max(0,+String(x.value).replace(',','.')||0);save();render();return}
  if(x.id=='gu'){S.settings.goalType=x.value=='pages'?'pages':'min';save();render();return}
  if(x.dataset.st){S.settings[x.dataset.st]=x.type=='checkbox'?x.checked:x.dataset.num?+x.value:x.value;aplicar();save();render()}});

(async()=>{await load();aplicar();go('biblioteca');save()})();
</script></body></html>
